<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SLOT</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#2b0040,#090010 70%);
    overflow-y:auto;
    font-family:sans-serif;
    color:white;
}

.container{
    width:95%;
    max-width:1000px;
    background:linear-gradient(
        180deg,
        #3d003d,
        #17001f
    );

    border:6px solid gold;
    border-radius:35px;

    padding:30px;

    text-align:center;

    box-shadow:
    0 0 30px gold,
    inset 0 0 20px rgba(255,255,255,0.2);

    position:relative;
}

h1{
    font-size:60px;
    margin-bottom:20px;
    color:#ffe600;

    text-shadow:
    0 0 10px #ffe600,
    0 0 40px orange,
    0 0 70px red;
}

.info{

    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;

    margin-bottom:25px;

}

.panel{

    background:#111;

    border:3px solid #00ffee;

    border-radius:20px;

    padding:15px 25px;

    min-width:180px;

    box-shadow:
    0 0 15px #00ffee;

    font-size:24px;

}

.slot-machine{

    display:flex;
    justify-content:center;
    align-items:center;

    gap:25px;

    margin-top:30px;

}

.slot-area{

    display:flex;
    gap:20px;

}

.slot{

    width:150px;
    height:150px;

    background:black;

    border:5px solid gold;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:80px;

    box-shadow:
    0 0 20px gold,
    inset 0 0 20px orange;

}

.lever-box{

    display:flex;
    flex-direction:column;
    align-items:center;

}

.lever{

    width:25px;
    height:180px;

    background:silver;

    border-radius:20px;

    position:relative;

    cursor:pointer;

    transition:0.15s;

    box-shadow:
    0 0 10px white;

}

.lever:active{

    transform:
    translateY(25px);

}

.ball{

    width:60px;
    height:60px;

    background:red;

    border-radius:50%;

    position:absolute;

    top:-10px;
    left:-18px;

    box-shadow:
    0 0 20px red,
    0 0 40px orange;

}

.controls{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:20px;

    flex-wrap:wrap;

}

.bet-btn{

    background:#00bfff;

    color:white;

    border:none;

    border-radius:15px;

    padding:15px 25px;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 15px #00bfff;

    transition:0.2s;

}

.bet-btn:hover{

    transform:scale(1.05);

}

#result{

    margin-top:35px;

    font-size:40px;

    font-weight:bold;

    min-height:60px;

}

.win{

    color:#ffe600;

    text-shadow:
    0 0 10px yellow,
    0 0 30px orange;

}

.lose{

    color:#ff6666;

}

.shop{

    margin-top:40px;

    padding:25px;

    border-radius:25px;

    background:rgba(255,255,255,0.06);

    border:3px solid #00c3ff;

    box-shadow:
    0 0 20px #00c3ff;

}

.shop h2{

    font-size:35px;

    color:#00ffee;

}

.shop-buttons{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:15px;

}

.shop-btn{

    width:220px;

    padding:20px;

    border:none;

    border-radius:20px;

    background:#8a2eff;

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 20px #8a2eff;

}

.shop-btn:hover{

    transform:scale(1.05);

}

@keyframes rainbow{

    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(360deg);}

}

@keyframes explode{

    0%{
        transform:scale(0);
        opacity:1;
    }

    100%{
        transform:scale(2);
        opacity:0;
    }

}

@media(max-width:850px){

    .slot-machine{

        flex-direction:column;

    }

    .slot{

        width:100px;
        height:100px;
        font-size:55px;

    }

    h1{

        font-size:42px;

    }

}

</style>
</head>

<body>

<div class="container">

    <h1>🎰 NEON SLOT 🎰</h1>

    <div class="info">

        <div class="panel">
            💴 所持金<br>
            <span id="yen">10000</span> 円
        </div>

        <div class="panel">
            🪙 コイン<br>
            <span id="coin">1000</span>
        </div>

        <div class="panel">
            ⭐ Lv<br>
            <span id="level">1</span>
        </div>

        <div class="panel">
            🍀 Luck<br>
            <span id="luckLevel">0</span>
        </div>

    </div>

    <div class="panel">
        BET :
        <span id="bet">100</span>
    </div>

    <div class="controls">

        <button class="bet-btn"
        onclick="changeBet(-100)">
            ➖ BET
        </button>

        <button class="bet-btn"
        onclick="changeBet(100)">
            ➕ BET
        </button>

    </div>

    <div class="slot-machine">

        <div class="slot-area">

            <div class="slot" id="slot1">🍒</div>

            <div class="slot" id="slot2">🍋</div>

            <div class="slot" id="slot3">7</div>

        </div>

        <div class="lever-box">

            <div class="lever"
            onclick="startSlot()">

                <div class="ball"></div>

            </div>

        </div>

    </div>

    <div id="result"></div>

    <div class="shop">

        <h2>🪙 SHOP 🪙</h2>

        <div class="shop-buttons">

            <button class="shop-btn"
            onclick="buyCoins(1000,500)">

                1000コイン<br>
                500円

            </button>

            <button class="shop-btn"
            onclick="buyCoins(5000,2000)">

                5000コイン<br>
                2000円

            </button>

            <button class="shop-btn"
            onclick="upgradeLuck()">

                🍀 確率UP<br>
                5000コイン

            </button>

        </div>

    </div>

</div>

<script>

let yen = 10000;
let coin = 1000;
let bet = 100;

let level = 1;
let exp = 0;
let nextExp = 1000;

let luckLevel = 0;

function getRandomSymbol(){

    let pool = [

        "🍒","🍒","🍒","🍒","🍒",

        "🍋","🍋","🍋","🍋",

        "🍉","🍉","🍉",

        "⭐","⭐",

        "7"

    ];

    for(let i=0;i<luckLevel;i++){

        pool.push("⭐");

        if(i >= 3){

            pool.push("7");

        }

    }

    return pool[
        Math.floor(Math.random()*pool.length)
    ];

}

function updateUI(){

    document.getElementById("yen").innerHTML = yen;

    document.getElementById("coin").innerHTML = coin;

    document.getElementById("bet").innerHTML = bet;

    document.getElementById("level").innerHTML = level;

    document.getElementById("luckLevel").innerHTML =
    luckLevel;

}

function changeBet(amount){

    bet += amount;

    if(bet < 100){

        bet = 100;

    }

    if(bet > 5000){

        bet = 5000;

    }

    updateUI();

}

function startSlot(){

    if(coin < bet){

        document.getElementById("result").innerHTML =
        "🪙 コイン不足";

        return;

    }

    coin -= bet;

    updateUI();

    let count = 0;

    const interval = setInterval(() => {

        document.getElementById("slot1").innerHTML =
        getRandomSymbol();

        document.getElementById("slot2").innerHTML =
        getRandomSymbol();

        document.getElementById("slot3").innerHTML =
        getRandomSymbol();

        count++;

        if(count > 20){

            clearInterval(interval);

            checkResult();

        }

    },100);

}

function checkResult(){

    const s1 =
    document.getElementById("slot1").innerHTML;

    const s2 =
    document.getElementById("slot2").innerHTML;

    const s3 =
    document.getElementById("slot3").innerHTML;

    const result =
    document.getElementById("result");

    if(s1 == s2 && s2 == s3){

        let reward = bet * 5;

        if(s1 == "7"){

            reward = bet * 30;

            document.body.style.animation =
            "rainbow 0.3s infinite";

            result.innerHTML =
            "🌈🔥 SUPER JACKPOT +" +
            reward +
            " 🔥🌈";

            createExplosion();

            setTimeout(()=>{

                document.body.style.animation = "";

            },4000);

        }else{

            result.innerHTML =
            "🎉 JACKPOT +" +
            reward;

        }

        result.className = "win";

        coin += reward;

        exp += reward;

        if(exp >= nextExp){

            exp -= nextExp;

            level++;

            nextExp *= 1.5;

        }

    }else{

        result.innerHTML =
        "😢 ハズレ";

        result.className =
        "lose";

    }

    saveGame();

    updateUI();

}

function createExplosion(){

    for(let i=0;i<50;i++){

        const particle =
        document.createElement("div");

        particle.innerHTML = "✨";

        particle.style.position = "fixed";

        particle.style.left =
        Math.random()*100 + "vw";

        particle.style.top =
        Math.random()*100 + "vh";

        particle.style.fontSize =
        (Math.random()*40+20) + "px";

        particle.style.pointerEvents = "none";

        particle.style.zIndex = "9999";

        particle.style.animation =
        "explode 1s forwards";

        document.body.appendChild(particle);

        setTimeout(()=>{

            particle.remove();

        },1000);

    }

}

function buyCoins(amount,price){

    if(yen < price){

        document.getElementById("result").innerHTML =
        "💴 お金不足";

        return;

    }

    yen -= price;

    coin += amount;

    saveGame();

    updateUI();

}

function upgradeLuck(){

    const cost = 5000;

    if(coin < cost){

        document.getElementById("result").innerHTML =
        "🪙 コイン不足";

        return;

    }

    coin -= cost;

    luckLevel++;

    document.getElementById("result").innerHTML =
    "🍀 確率UP !!";

    document.getElementById("result").className =
    "win";

    saveGame();

    updateUI();

}

function saveGame(){

    localStorage.setItem("slotYen",yen);

    localStorage.setItem("slotCoin",coin);

    localStorage.setItem("slotLevel",level);

    localStorage.setItem("slotLuck",luckLevel);

}

function loadGame(){

    const savedYen =
    localStorage.getItem("slotYen");

    const savedCoin =
    localStorage.getItem("slotCoin");

    const savedLevel =
    localStorage.getItem("slotLevel");

    const savedLuck =
    localStorage.getItem("slotLuck");

    if(savedYen){

        yen = Number(savedYen);

    }

    if(savedCoin){

        coin = Number(savedCoin);

    }

    if(savedLevel){

        level = Number(savedLevel);

    }

    if(savedLuck){

        luckLevel = Number(savedLuck);

    }

}

loadGame();

updateUI();

</script>

</body>
</html>
