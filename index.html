<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SLOT</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:
    radial-gradient(circle at top,#35114d,#12051d 60%);
    overflow-y:auto;
    overflow-x:hidden;
    font-family:sans-serif;
    color:white;
    padding:20px 0;
}

.container{
    width:90%;
    max-width:900px;
    background:rgba(0,0,0,0.35);
    border:3px solid #ff00cc;
    border-radius:30px;
    padding:25px;
    text-align:center;
    box-shadow:
    0 0 20px #ff00cc,
    0 0 50px #6a00ff;
}

h1{
    font-size:55px;
    margin-bottom:20px;
    color:#ffe600;
    text-shadow:
    0 0 10px #ffe600,
    0 0 30px #ff9900,
    0 0 50px #ff5500;
}

.money{
    font-size:28px;
    margin-bottom:10px;
    color:#00ffee;
    text-shadow:0 0 15px #00ffee;
}

.bet-text{
    font-size:28px;
    margin-bottom:20px;
}

.slot-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.slot{
    width:120px;
    height:120px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;
    line-height:1;

    background:#111;
    border:5px solid #ffe600;
    border-radius:25px;

    box-shadow:
    0 0 20px #ffe600,
    inset 0 0 20px #ff9900;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.bet{
    background:#00bfff;
    box-shadow:0 0 20px #00bfff;
}

.start{
    background:#00ff88;
    box-shadow:0 0 20px #00ff88;
}

#result{
    margin-top:30px;
    font-size:35px;
    font-weight:bold;
    min-height:50px;
}

.win{
    color:#ffe600;
    text-shadow:
    0 0 10px #ffe600,
    0 0 30px #ff8800;
}

.lose{
    color:#ff6666;
}

.shop{
    margin-top:40px;
    padding:25px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    border:2px solid #00c3ff;
    box-shadow:0 0 20px #00c3ff;
}

.shop h2{
    font-size:35px;
    margin-bottom:20px;
    text-align:center;
    color:#00ffee;
}

.shop-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.shop-btn{
    width:220px;
    min-height:120px;
    padding:15px;
    font-size:20px;
    line-height:1.5;
    background:#8a2eff;
    color:white;
    box-shadow:0 0 20px #8a2eff;
}

@keyframes rainbow{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(360deg);}
}

@keyframes explode{
    0%{
        transform:scale(0);
        opacity:1;
    }

    100%{
        transform:scale(2);
        opacity:0;
    }
}

@media(max-width:700px){

    h1{
        font-size:40px;
    }

    .slot{
        width:90px;
        height:90px;
        font-size:45px;
    }

    button{
        font-size:18px;
        padding:12px 20px;
    }

    .shop-btn{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>🎰 NEON SLOT 🎰</h1>

    <div class="money">
        💴 所持金 :
        <span id="yen">10000</span> 円
    </div>

    <div class="money">
        🪙 コイン :
        <span id="coin">1000</span>
    </div>

    <div class="money">
        ⭐ レベル :
        <span id="level">1</span>
    </div>

    <div class="money">
        EXP :
        <span id="exp">0</span>
        /
        <span id="nextExp">1000</span>
    </div>

    <div class="money">
        🍀 確率レベル :
        <span id="luckLevel">0</span>
    </div>

    <div class="bet-text">
        BET :
        <span id="bet">100</span>
    </div>

    <div class="slot-area">

        <div class="slot" id="slot1">🍒</div>

        <div class="slot" id="slot2">7</div>

        <div class="slot" id="slot3">⭐</div>

    </div>

    <div class="controls">

        <button class="bet"
        onclick="changeBet(-100)">
            BET -
        </button>

        <button class="start"
        onclick="startSlot()">
            START
        </button>

        <button class="bet"
        onclick="changeBet(100)">
            BET +
        </button>

    </div>

    <div id="result"></div>

    <div class="shop">

        <h2>🪙 SHOP 🪙</h2>

        <div class="shop-buttons">

            <button class="shop-btn"
            onclick="buyCoins(1000,500)">

                1000コイン購入<br>
                500円

            </button>

            <button class="shop-btn"
            onclick="buyCoins(5000,2000)">

                5000コイン購入<br>
                2000円

            </button>

            <button class="shop-btn"
            onclick="buyCoins(10000,3500)">

                10000コイン購入<br>
                3500円

            </button>

            <button class="shop-btn"
            onclick="upgradeLuck()">

                🍀 確率UP<br>
                5000コイン

            </button>

        </div>

    </div>

</div>

<script>

let yen = 10000;
let coin = 1000;
let bet = 100;

let level = 1;
let exp = 0;
let nextExp = 1000;

let luckLevel = 0;


// ==========================
// レア確率システム
// ==========================

function getRandomSymbol(){

    let pool = [

        "🍒","🍒","🍒","🍒","🍒",

        "🍋","🍋","🍋","🍋",

        "🍉","🍉","🍉",

        "⭐","⭐",

        "7"

    ];

    for(let i=0;i<luckLevel;i++){

        pool.push("⭐");

        if(i >= 3){

            pool.push("7");

        }

    }

    return pool[
        Math.floor(Math.random()*pool.length)
    ];

}


// ==========================
// UI更新
// ==========================

function updateUI(){

    document.getElementById("yen").innerHTML = yen;

    document.getElementById("coin").innerHTML = coin;

    document.getElementById("bet").innerHTML = bet;

    document.getElementById("level").innerHTML = level;

    document.getElementById("exp").innerHTML = exp;

    document.getElementById("nextExp").innerHTML =
    nextExp;

    document.getElementById("luckLevel").innerHTML =
    luckLevel;

}


// ==========================
// BET変更
// ==========================

function changeBet(amount){

    bet += amount;

    if(bet < 100){

        bet = 100;

    }

    if(bet > 500){

        bet = 500;

    }

    updateUI();

}


// ==========================
// EXP追加
// ==========================

function addExp(amount){

    exp += amount;

    while(exp >= nextExp){

        exp -= nextExp;

        level++;

        nextExp = Math.floor(nextExp * 1.5);

        document.getElementById("result").innerHTML =
        "⭐ LEVEL UP !! Lv." + level;

        document.getElementById("result").className =
        "win";

    }

}


// ==========================
// 確率UP
// ==========================

function upgradeLuck(){

    const cost = 5000;

    if(level < 5){

        document.getElementById("result").innerHTML =
        "⭐ Lv5で解放";

        return;

    }

    if(coin < cost){

        document.getElementById("result").innerHTML =
        "🪙 コイン不足";

        return;

    }

    coin -= cost;

    luckLevel++;

    document.getElementById("result").innerHTML =
    "🍀 確率アップ！ Lv." + luckLevel;

    document.getElementById("result").className =
    "win";

    saveGame();

    updateUI();

}


// ==========================
// スロット開始
// ==========================

function startSlot(){

    if(coin < bet){

        document.getElementById("result").innerHTML =
        "🪙 コイン不足";

        return;

    }

    coin -= bet;

    updateUI();

    document.getElementById("result").innerHTML = "";

    let count = 0;

    const interval = setInterval(() => {

        document.getElementById("slot1").innerHTML =
        getRandomSymbol();

        document.getElementById("slot2").innerHTML =
        getRandomSymbol();

        document.getElementById("slot3").innerHTML =
        getRandomSymbol();

        count++;

        if(count > 20){

            clearInterval(interval);

            checkResult();

        }

    },100);

}


// ==========================
// 当たり判定
// ==========================

function checkResult(){

    const s1 =
    document.getElementById("slot1").innerHTML;

    const s2 =
    document.getElementById("slot2").innerHTML;

    const s3 =
    document.getElementById("slot3").innerHTML;

    const result =
    document.getElementById("result");

    if(s1 == s2 && s2 == s3){

        let reward = bet * 5;

        if(s1 == "7"){

            reward = bet * 30;

            document.body.style.animation =
            "rainbow 0.3s infinite";

            result.innerHTML =
            "🌈🔥 SUPER JACKPOT +" +
            reward +
            "コイン 🔥🌈";

            createExplosion();

            setTimeout(()=>{

                document.body.style.animation = "";

            },4000);

        }else{

            result.innerHTML =
            "🎉 JACKPOT +" +
            reward +
            "コイン 🎉";

        }

        result.className = "win";

        coin += reward;

        addExp(reward);

    }else{

        result.innerHTML = "😢 ハズレ";

        result.className = "lose";

    }

    saveGame();

    updateUI();

}


// ==========================
// 爆発演出
// ==========================

function createExplosion(){

    for(let i=0;i<50;i++){

        const particle =
        document.createElement("div");

        particle.innerHTML = "✨";

        particle.style.position = "fixed";

        particle.style.left =
        Math.random()*100 + "vw";

        particle.style.top =
        Math.random()*100 + "vh";

        particle.style.fontSize =
        (Math.random()*40+20) + "px";

        particle.style.pointerEvents = "none";

        particle.style.zIndex = "9999";

        particle.style.animation =
        "explode 1s forwards";

        document.body.appendChild(particle);

        setTimeout(()=>{

            particle.remove();

        },1000);

    }

}


// ==========================
// コイン購入
// ==========================

function buyCoins(amount,price){

    if(yen < price){

        document.getElementById("result").innerHTML =
        "💴 お金不足";

        return;

    }

    yen -= price;

    coin += amount;

    document.getElementById("result").innerHTML =
    "🪙 " + amount + "コイン購入！";

    document.getElementById("result").className =
    "win";

    saveGame();

    updateUI();

}


// ==========================
// 保存
// ==========================

function saveGame(){

    localStorage.setItem("slotYen",yen);

    localStorage.setItem("slotCoin",coin);

    localStorage.setItem("slotLevel",level);

    localStorage.setItem("slotExp",exp);

    localStorage.setItem("slotNextExp",nextExp);

    localStorage.setItem("slotLuck",luckLevel);

}


// ==========================
// 読み込み
// ==========================

function loadGame(){

    const savedYen =
    localStorage.getItem("slotYen");

    const savedCoin =
    localStorage.getItem("slotCoin");

    const savedLevel =
    localStorage.getItem("slotLevel");

    const savedExp =
    localStorage.getItem("slotExp");

    const savedNextExp =
    localStorage.getItem("slotNextExp");

    const savedLuck =
    localStorage.getItem("slotLuck");

    if(savedYen !== null){

        yen = Number(savedYen);

    }

    if(savedCoin !== null){

        coin = Number(savedCoin);

    }

    if(savedLevel !== null){

        level = Number(savedLevel);

    }

    if(savedExp !== null){

        exp = Number(savedExp);

    }

    if(savedNextExp !== null){

        nextExp = Number(savedNextExp);

    }

    if(savedLuck !== null){

        luckLevel = Number(savedLuck);

    }

}

loadGame();

updateUI();

</script>

</body>
</html>
